name: Deploy on GitHub Pages

on:
  push:
    branches: [main, master]
  # Pour relancer le déploiement sans avoir à pousser un commit — utile après un
  # changement de réglage côté dépôt.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `enablement: true` active GitHub Pages sur le dépôt s'il ne l'est pas déjà, au lieu
      # d'exiger un passage par Settings → Pages avant le premier déploiement.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # BrowserRouter sert /habitat et /pokedex : sans ce repli, un lien profond ou un
      # rafraîchissement renverrait le 404 de GitHub Pages.
      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
