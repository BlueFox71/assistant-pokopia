[package]
name = "assistant-pokopia"
version = "1.0.0"
description = "Index des préférences de Pokémon Pokopia, entièrement hors ligne"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# L'exe est distribué tel quel par Le Grenier et porte déjà 1 081 vignettes : autant ne
# pas y ajouter de binaire inutilement gros.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
